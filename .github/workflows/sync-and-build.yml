name: Sync upstream and build Docker image

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 3 点（北京时间 11 点）检查一次上游
  workflow_dispatch:       # 支持手动触发

env:
  UPSTREAM_REPO: no1yu/HivisionIDPhotosPro
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hivisionidphotospro

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(gh api repos/${{ github.repository }} --jq .pushed_at)
          gh repo sync ${{ github.repository }} --source ${{ env.UPSTREAM_REPO }} --force
          AFTER=$(gh api repos/${{ github.repository }} --jq .pushed_at)
          echo "before=$BEFORE" >> "$GITHUB_ENV"
          echo "after=$AFTER" >> "$GITHUB_ENV"

      - name: Check if fork actually updated
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$before" != "$after" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Fork has new upstream commits."
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          fi

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
